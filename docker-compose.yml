services:
  engine:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./services/engine:/app
      - ./.env:/app/.env:ro
    command: bash -c "pip install -r requirements.txt -q && uvicorn main:app --host 0.0.0.0 --port 8787"
    ports:
      - "8787:8787"
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: sh -c "npm i && npm run build && npx vite preview --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://127.0.0.1:8787
    depends_on:
      - engine
